<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clickrypt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; background: #17293c; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .header { display: flex; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid #1a3349; }
    .header svg { color: #1ebbd4; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .content { padding: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #8ba3b8; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px 12px; background: #1a3349; border: 1px solid #2a4055; border-radius: 6px; color: #e2e8f0; font-size: 14px; }
    .form-group input:focus { outline: none; border-color: #1ebbd4; }
    .btn { width: 100%; padding: 10px; background: #1ebbd4; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #1599b8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #2a4055; }
    .btn-secondary:hover { background: #213548; }
    .error { color: #f89c11; font-size: 12px; margin-top: 8px; }
    .success { color: #1ebbd4; font-size: 12px; margin-top: 8px; }
    .vault-list { list-style: none; }
    .vault-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid #1a3349; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
    .vault-item:hover { background: #1a3349; }
    .vault-item .name { font-size: 13px; font-weight: 500; }
    .vault-item .uri { font-size: 11px; color: #5a7a95; }
    .vault-item .fill-btn { background: #1ebbd4; color: white; border: none; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .lock-btn { width: 100%; padding: 8px; background: #2a4055; color: #e2e8f0; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 12px; }
    .lock-btn:hover { background: #213548; }
    .empty { text-align: center; color: #5a7a95; font-size: 13px; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <h1>Clickrypt</h1>
  </div>
  <div class="content" id="content"></div>
  <script src="popup.js"></script>
</body>
</html>
